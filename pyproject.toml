[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatch-angee"
version = "0.2.6"
description = "Hatchling build hooks for Angee addons — generated entry points + source distribution."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Angee, Inc.", email = "hi@angee.ai" }]
keywords = ["hatch", "hatchling", "build", "plugin", "angee", "addons"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Hatch",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["hatchling>=1.18", "packaging>=24", "tomlkit>=0.13"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ang-ee/hatch-angee"
Issues = "https://github.com/ang-ee/hatch-angee/issues"

# Register the hooks with hatchling so an addon repo references them by name
# (no per-repo hook code). See src/hatch_angee/plugin.py.
[project.entry-points.hatch]
angee = "hatch_angee.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hatch_angee"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["build/", "dist/"]

# hatchling ships no type information for its plugin interfaces.
[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

# Tests build throwaway addon trees and assert on them; the per-test
# annotation ceremony adds churn without catching bugs. Keep value checks on.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
